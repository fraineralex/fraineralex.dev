<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="1987" viewBox="0 0 1170 1987"><image href="/images/blog/posts/content/vercel-jev-free-until-sep25.webp" width="1170" height="1987"/><g fill="#000"><rect x="18" y="220" width="1125" height="510"/><rect x="58" y="910" width="1045" height="300"/><rect x="65" y="1217" width="1040" height="90"/><rect x="65" y="1940" width="800" height="30"/></g><g font-family="Arial,sans-serif" fill="#e7e7e7"><text x="27" y="287" font-size="48"><tspan>Jev de </tspan><tspan fill="#4b9cff">@typesafeai</tspan><tspan> es gratis en Vercel</tspan><tspan x="27" dy="70">AI Gateway hasta el 25 de septiembre.</tspan></text><text x="27" y="492" font-size="48"><tspan x="27">Desarrolla con el modelo adoptado más rápido</tspan><tspan x="27" dy="70">en Gateway sin coste.</tspan></text><text x="65" y="955" font-size="42"><tspan x="65">Jev se adoptó más rápido que cualquier otro</tspan><tspan x="65" dy="59">modelo en la historia de AI Gateway.</tspan></text><text x="65" y="1105" font-size="42"><tspan x="65">Durante el primer día, </tspan><tspan fill="#4b9cff">@typesafeai</tspan><tspan> llegó a ~13% de</tspan><tspan x="65" dy="59">los equipos, 2x la familia GPT-5.6 y 6x Fable 5.1.</tspan></text></g><g font-family="monospace" fill="#e7e7e7"><text x="73" y="1245" font-size="19">JEV SE LANZA CON LA ADOPCIÓN MÁS RÁPIDA EN AI GATEWAY</text><text x="73" y="1270" font-size="19">PORCENTAJE DE EQUIPOS, PRIMERAS 24 HORAS</text><text x="73" y="1962" font-size="9">FUENTE: VERCEL AI GATEWAY. EL PORCENTAJE DE EQUIPOS SE CALCULA SOLO ENTRE EQUIPOS DE PAGO.</text></g></svg>
