<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="1470" viewBox="0 0 1170 1470"><image href="/images/blog/posts/content/vercel-jev-adoption-chart.webp" width="1170" height="1470"/><g fill="#000"><rect x="18" y="235" width="1125" height="365"/><rect x="65" y="680" width="1050" height="95"/><rect x="66" y="1372" width="800" height="38"/></g><g font-family="Arial,sans-serif" fill="#e7e7e7"><text x="27" y="294" font-size="50"><tspan x="27">Jev se adoptó más rápido que cualquier otro</tspan><tspan x="27" dy="72">modelo en la historia de AI Gateway.</tspan></text><text x="27" y="505" font-size="48"><tspan x="27">Durante el primer día, </tspan><tspan fill="#4b9cff">@typesafeai</tspan><tspan> llegó a ~13% de</tspan><tspan x="27" dy="72">los equipos, 2x la familia GPT-5.6 y 6x Fable 5.1.</tspan></text></g><g font-family="monospace" fill="#e7e7e7"><text x="74" y="708" font-size="20">JEV SE LANZA CON LA ADOPCIÓN MÁS RÁPIDA EN AI GATEWAY</text><text x="74" y="735" font-size="20">PORCENTAJE DE EQUIPOS, PRIMERAS 24 HORAS</text><text x="74" y="1402" font-size="10">FUENTE: VERCEL AI GATEWAY. EL PORCENTAJE DE EQUIPOS SE CALCULA SOLO ENTRE EQUIPOS DE PAGO.</text></g></svg>
