<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" rx="28" fill="#09090b"/><text x="600" y="70" text-anchor="middle" fill="#f4f4f5" font-family="Arial" font-size="34" font-weight="700">JSON de un LLM frente a evaluación con jev</text><g font-family="Arial" text-anchor="middle"><rect x="90" y="150" width="440" height="330" rx="20" fill="#18181b" stroke="#71717a" stroke-width="3"/><text x="310" y="210" fill="#d4d4d8" font-size="28">LLM estructurado</text><text x="310" y="285" fill="#f4f4f5" font-size="25">escribe el árbol completo</text><text x="310" y="345" fill="#a1a1aa" font-size="22">token → token → token</text><text x="310" y="420" fill="#fb7185" font-size="24">más profundo, más lento</text><rect x="670" y="150" width="440" height="330" rx="20" fill="#0f2927" stroke="#2dd4bf" stroke-width="3"/><text x="890" y="210" fill="#99f6e4" font-size="28">jev</text><text x="890" y="285" fill="#f4f4f5" font-size="25">evalúa decisiones</text><text x="890" y="345" fill="#a1a1aa" font-size="22">qué usar + dónde colocarlo</text><text x="890" y="420" fill="#5eead4" font-size="24">composición más directa</text></g></svg>
